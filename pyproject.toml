[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "heic-converter-tui"
version = "0.3.0"
description = "Arrow-key TUI and CLI for converting HEIC images to JPEG or PNG"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["heic", "jpeg", "png", "converter", "tui", "macos"]
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
  "pillow>=10.0",
  "pillow-heif>=0.18",
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "questionary>=2.0.1",
  "rich>=13.0",
  "typer>=0.12",
]

[project.urls]
Repository = "https://github.com/jaehunshin-git/heiccy"
Homepage = "https://github.com/jaehunshin-git/heiccy"
Issues = "https://github.com/jaehunshin-git/heiccy/issues"

[project.scripts]
heic-converter = "heic_converter.cli:run"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.14",
]

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
ignore = ["B008"]

[tool.hatch.build.targets.wheel]
packages = ["src/heic_converter"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "pyproject.toml",
  "README.pypi.md",
  "LICENSE",
]
